# Optional local Neo4j for development and testing.
# CognoDB speaks the same openCypher-over-Bolt protocol, so anything that works
# here works against a CognoDB Cloud instance (the submission target).
#
#   npm run db:up     # start Neo4j
#   npm run seed      # load the dataset
#   npm run start     # run the app
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: six-degrees-neo4j
    ports:
      - "7687:7687" # Bolt (what the app talks to)
      - "7474:7474" # Browser UI (optional, for inspecting the graph)
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_bolt_listen__address: 0.0.0.0:7687
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  neo4j-data:
