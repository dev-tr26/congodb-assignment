# Local development stack: Neo4j database + the Six Degrees FastAPI app.
# CognoDB speaks the same openCypher-over-Bolt protocol, so anything that works
# here works against a CognoDB Cloud instance (the submission target).
#
#   docker compose up -d --build           # start Neo4j + the app (http://localhost:3000)
#   docker compose up -d neo4j             # just the database
#   docker compose run --rm app python scripts/seed.py   # load the dataset into Neo4j
services:
  neo4j:
    image: neo4j:5.26-community
    container_name: six-degrees-neo4j
    ports:
      - "7687:7687" # Bolt (what the app talks to)
      - "7474:7474" # Browser UI (optional, for inspecting the graph)
    environment:
      NEO4J_AUTH: neo4j/password
      NEO4J_server_memory_heap_initial__size: 256m
      NEO4J_server_memory_heap_max__size: 512m
      NEO4J_server_memory_pagecache_size: 256m
      NEO4J_server_bolt_listen__address: 0.0.0.0:7687
    volumes:
      - neo4j-data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:7474 > /dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12

  app:
    build: .
    container_name: six-degrees-app
    ports:
      - "3000:3000" # the web app (frontend + API)
    environment:
      # Point the app at the local Neo4j service above. Override with your own
      # bolt:// / bolt+s:// URI if you prefer to develop against CognoDB Cloud.
      NEO4J_URI: bolt://neo4j:7687
      NEO4J_USER: neo4j
      NEO4J_PASSWORD: password
      # PORT is only needed here because the Dockerfile's CMD defaults to 3000;
      # on Render the platform injects PORT itself — don't set it there.
      PORT: 3000
    depends_on:
      neo4j:
        condition: service_healthy

volumes:
  neo4j-data:
